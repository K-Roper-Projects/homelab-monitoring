name: HomeLab Deployment

on:
  workflow_dispatch:

jobs:
  connectivity-test:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Test HomeLab connectivity
        run: tailscale ping --c 3 ${{ vars.HOMELAB_HOST }}

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMELAB_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "${{ vars.HOMELAB_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connectivity
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            kevin@${{ vars.HOMELAB_HOST }} \
            'hostname && whoami && pwd'

      - name: Update HomeLab repository
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            kevin@${{ vars.HOMELAB_HOST }} \
            'cd ~/HomeLab/Monitoring && git fetch deploy-read main && git merge --ff-only FETCH_HEAD'

      - name: Validate live Docker Compose configuration
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            kevin@${{ vars.HOMELAB_HOST }} \
            'cd ~/HomeLab/Monitoring && docker compose config --quiet'
